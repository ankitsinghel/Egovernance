global:
  scrape_interval:     4s # By default, scrape targets every 15 seconds.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      # - targets: ['172.28.176.1:3000'] if prometheus is running on docker and app on host machine
      - targets: ['satark:3000']
    metrics_path: "/api/metrics"